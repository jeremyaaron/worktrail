name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      WORKTRAIL_VERIFY_ADMIN_DATABASE_URL: postgres://worktrail:worktrail@localhost:5432/worktrail

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: worktrail
          POSTGRES_USER: worktrail
          POSTGRES_PASSWORD: worktrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worktrail -d worktrail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Verify owned full workflow
        run: npm run verify -- --database=service

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
