name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://worktrail:worktrail@localhost:5432/worktrail

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: worktrail
          POSTGRES_USER: worktrail
          POSTGRES_PASSWORD: worktrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worktrail -d worktrail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prepare database
        run: npm run db:reset && npm run db:migrate && npm run db:seed

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Test authored-content editor
        run: npm run test:editor

      - name: Test application browser workflows
        env:
          WORKTRAIL_ATTACHMENT_STORAGE_PATH: ${{ runner.temp }}/worktrail-original-attachments
          WORKTRAIL_E2E_ATTACHMENT_STORAGE_PATH: ${{ runner.temp }}/worktrail-e2e-attachments
          WORKTRAIL_E2E_WEB_PORT: 4315
          API_PORT: 3000
        run: npm run test:e2e

      - name: Test compiled production preview
        env:
          WORKTRAIL_ATTACHMENT_STORAGE_PATH: ${{ runner.temp }}/worktrail-original-attachments
          API_PORT: 4319
        run: npx playwright test --config playwright.production.config.ts

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
